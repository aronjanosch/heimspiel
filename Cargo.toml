[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/aronjanosch/heimspiel"

[workspace.dependencies]
heimspiel-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tauri = "2"
tauri-build = "2"
