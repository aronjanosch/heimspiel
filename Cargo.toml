[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/aronjanosch/heimspiel"

[workspace.dependencies]
heimspiel-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tauri = "2"
tauri-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "1"
ureq = "3"
xmltree = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
